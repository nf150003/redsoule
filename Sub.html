<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <style>
    body{
      font-family: Tahoma, Arial;
      background:#3A6EA5;
      padding:20px;
    }

    .window{
      width:650px;
      margin:auto;
      background:#ECE9D8;
      border:2px solid #0A246A;
    }

    .titlebar{
      background:linear-gradient(to bottom,#0A246A,#3A6EA5);
      color:white;
      padding:8px;
      font-weight:bold;
      font-size:13px;
    }

    .content{
      padding:10px;
    }

    .sheetname{
      font-size:12px;
      margin-bottom:8px;
      color:#003366;
      font-weight:bold;
    }

    table{
      width:100%;
      border-collapse:collapse;
      background:white;
    }

    th{
      background:#D4D0C8;
      border:1px solid #666;
      padding:6px;
      font-size:13px;
    }

    td{
      border:1px solid #999;
      text-align:center;
      padding:5px;
      font-size:13px;
    }

    input{
      width:90px;
      text-align:center;
      border:1px solid #666;
      padding:3px;
      font-family:Tahoma;
    }

    .footer{
      text-align:right;
      margin-top:10px;
    }

    button{
      padding:5px 20px;
      border:1px solid #0A246A;
      background:#ECE9D8;
      cursor:pointer;
      font-family:Tahoma;
    }

    button:hover{
      background:#D6D3CE;
    }

    #status{
      margin-top:8px;
      font-size:12px;
      color:green;
      font-weight:bold;
    }
  </style>
</head>

<body>

<div class="window">

  <div class="titlebar">
    Universal Marks Entry System
  </div>

  <div class="content">

    <div class="sheetname" id="sheetTitle"></div>

    <table>
      <thead>
        <tr>
          <th>Code</th>
          <th>Marks</th>
        </tr>
      </thead>

      <tbody id="data"></tbody>
    </table>

    <div class="footer">
      <button onclick="saveData()">Save</button>
    </div>

    <div id="status"></div>

  </div>

</div>

<script>

let sheetName = "";

/* ======================
   GET SHEET FROM URL
====================== */
function getSheetFromURL(){
  const params = new URLSearchParams(window.location.search);
  return params.get("sheet") || "English";
}

sheetName = getSheetFromURL();

document.getElementById("sheetTitle").innerText =
  "Sheet: " + sheetName;

/* ======================
   LOAD DATA
====================== */
google.script.run
.withSuccessHandler(function(res){

  let html = "";

  res.forEach(r=>{
    html += `
      <tr>
        <td>${r.code}</td>
        <td>
          <input type="number"
                 value="${r.marks || ''}"
                 data-row="${r.row}">
        </td>
      </tr>
    `;
  });

  document.getElementById("data").innerHTML = html;

})
.getData(sheetName);


/* ======================
   SAVE DATA
====================== */
function saveData(){

  let inputs = document.querySelectorAll("input");

  let send = [];

  inputs.forEach(i=>{
    send.push({
      row: Number(i.dataset.row),
      marks: i.value
    });
  });

  google.script.run
  .withSuccessHandler(function(msg){
    document.getElementById("status").innerHTML =
      "✓ Saved Successfully";
  })
  .saveData(sheetName, send);

}

</script>

</body>
</html>
