<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <style>
    body{
      background:#3A6EA5;
      font-family:Tahoma, Arial, sans-serif;
      padding:20px;
    }

    .window{
      width:600px;
      margin:auto;
      background:#ECE9D8;
      border:1px solid #003C74;
    }

    .titlebar{
      background:linear-gradient(to bottom,#0A246A,#3A6EA5);
      color:white;
      padding:6px 10px;
      font-weight:bold;
      font-size:13px;
    }

    .content{
      padding:10px;
    }

    table{
      width:100%;
      border-collapse:collapse;
      background:white;
    }

    th{
      background:#D4D0C8;
      border:1px solid #808080;
      padding:6px;
      text-align:center;
      font-size:12px;
    }

    td{
      border:1px solid #C0C0C0;
      padding:4px;
      text-align:center;
      font-size:12px;
    }

    input{
      width:80px;
      border:1px solid #7F9DB9;
      padding:2px;
      font-family:Tahoma;
      text-align:center;
    }

    .footer{
      text-align:right;
      margin-top:10px;
    }

    button{
      padding:4px 20px;
      border:1px solid #003C74;
      background:#ECE9D8;
      font-family:Tahoma;
      cursor:pointer;
    }

    button:hover{
      background:#D6D3CE;
    }
  </style>
</head>

<body>

<div class="window">

  <div class="titlebar">
    Marks Entry
  </div>

  <div class="content">

    <table>
      <thead>
        <tr>
          <th>Code</th>
          <th>Marks</th>
        </tr>
      </thead>

      <tbody id="dataArea"></tbody>
    </table>

    <div class="footer">
      <button onclick="saveMarks()">
        Save
      </button>
    </div>

  </div>

</div>

<script>

google.script.run
.withSuccessHandler(loadCodes)
.getCodes();

function loadCodes(data){

  const area=document.getElementById("dataArea");

  data.forEach(item=>{

    area.innerHTML += `
      <tr>
        <td>${item.code}</td>

        <td>
          <input
            type="number"
            value="${item.marks || ''}"
            data-row="${item.row}">
        </td>
      </tr>
    `;
  });

}

function saveMarks(){

  const saveData=[];

  document.querySelectorAll("input").forEach(inp=>{

    saveData.push({
      row:Number(inp.dataset.row),
      marks:inp.value
    });

  });

  google.script.run.saveMarks(saveData);

  alert("Marks Saved");
}

</script>

</body>
</html>
