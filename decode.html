<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Marks Entry System</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  min-height:100vh;
  background: linear-gradient(135deg,#0f172a,#1e293b,#0f172a);
  padding:30px;
  color:white;
}

/* MAIN WRAPPER */
.wrapper{
  max-width:1000px;
  margin:auto;
}

/* HEADER */
h2{
  font-size:30px;
  font-weight:700;
  margin-bottom:15px;
}

.top-box{
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(15px);
  border:1px solid rgba(255,255,255,0.1);
  padding:25px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
  margin-bottom:20px;
}

/* CONTROLS */
select{
  padding:12px 15px;
  border-radius:12px;
  border:none;
  font-size:15px;
  min-width:220px;
  outline:none;
}

button{
  padding:12px 20px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:600;
  transition:0.3s;
}

.save-btn{
  background: linear-gradient(135deg,#22c55e,#16a34a);
  color:white;
  margin-left:10px;
}

.save-btn:hover{
  transform:scale(1.05);
}

/* TABLE BOX */
.table-box{
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(15px);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
}

th{
  background: linear-gradient(135deg,#2563eb,#1d4ed8);
  padding:15px;
  font-size:15px;
}

td{
  padding:12px;
  text-align:center;
  border-bottom:1px solid rgba(255,255,255,0.1);
}

tr:hover{
  background:rgba(255,255,255,0.05);
}

/* INPUT */
input{
  width:120px;
  padding:8px;
  border-radius:10px;
  border:none;
  text-align:center;
  font-weight:600;
  outline:none;
}

input:focus{
  box-shadow:0 0 0 3px rgba(59,130,246,0.5);
}

/* FOOTER */
.footer{
  text-align:center;
  margin-top:15px;
  font-size:12px;
  color:#94a3b8;
}
</style>
</head>

<body>

<div class="wrapper">

  <div class="top-box">
    <h2>🎓 Teacher Marks Entry Panel</h2>

    <select id="subject" onchange="loadData()">
      <option value="">Loading subjects...</option>
    </select>

    <button class="save-btn" onclick="saveData()">💾 Save Marks</button>
  </div>

  <div class="table-box">
    <table>
      <thead>
        <tr>
          <th>CODE</th>
          <th>MARKS</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="footer">
    Smart School Management System
  </div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzI1P_tYW3Fz8p-maDIv-Ms1pxXWMhHtOu1glBS_JkCAugzZ1XpdO6qfXkJ-vNkn99B/exec";

let cache = [];

/*************************************************
 * LOAD SUBJECTS
 *************************************************/
async function loadSubjects() {
  const res = await fetch(API_URL + "?action=subjects");
  const data = await res.json();

  const select = document.getElementById("subject");
  select.innerHTML = `<option value="">Select Subject</option>`;

  data.subjects.forEach(sub => {
    const opt = document.createElement("option");
    opt.value = sub;
    opt.textContent = sub;
    select.appendChild(opt);
  });
}

/*************************************************
 * LOAD DATA
 *************************************************/
async function loadData() {
  const subject = document.getElementById("subject").value;
  if (!subject) return;

  const res = await fetch(API_URL + "?subject=" + subject);
  cache = await res.json();

  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  cache.forEach(row => {
    tbody.innerHTML += `
      <tr>
        <td>${row.code}</td>
        <td>
          <input type="number" value="${row.marks || ''}" data-code="${row.code}">
        </td>
      </tr>
    `;
  });
}

/*************************************************
 * SAVE DATA
 *************************************************/
async function saveData() {
  const subject = document.getElementById("subject").value;
  if (!subject) return alert("Select subject first");

  const inputs = document.querySelectorAll("input");

  const data = [];

  inputs.forEach(inp => {
    data.push({
      code: inp.dataset.code,
      marks: inp.value
    });
  });

  const res = await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      subject: subject,
      data: data
    })
  });

  const result = await res.json();

  alert(result.success ? "Saved successfully!" : "Error saving!");
}

/*************************************************
 * INIT
 *************************************************/
loadSubjects();

</script>

</body>
</html>
