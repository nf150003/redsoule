<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Marks Entry System</title>

<style>
body {
  font-family: Arial;
  padding: 20px;
  background: #f4f6f8;
}

h2 {
  margin-bottom: 10px;
}

select, button {
  padding: 10px;
  margin: 10px 0;
  font-size: 16px;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: white;
  margin-top: 20px;
}

th, td {
  border: 1px solid #ddd;
  padding: 10px;
  text-align: center;
}

th {
  background: #007bff;
  color: white;
}

input {
  width: 100px;
  padding: 5px;
  text-align: center;
}

button {
  background: green;
  color: white;
  border: none;
  cursor: pointer;
}

button:hover {
  background: darkgreen;
}
</style>
</head>

<body>

<h2>Teacher Marks Entry Panel</h2>

<select id="subject" onchange="loadData()">
  <option value="">Loading subjects...</option>
</select>

<br>

<button onclick="saveData()">💾 Save Marks</button>

<table>
  <thead>
    <tr>
      <th>CODE</th>
      <th>MARKS</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzI1P_tYW3Fz8p-maDIv-Ms1pxXWMhHtOu1glBS_JkCAugzZ1XpdO6qfXkJ-vNkn99B/exec";

let cache = [];

/*************************************************
 * LOAD SUBJECTS
 *************************************************/
async function loadSubjects() {
  const res = await fetch(API_URL + "?action=subjects");
  const data = await res.json();

  const select = document.getElementById("subject");
  select.innerHTML = `<option value="">Select Subject</option>`;

  data.subjects.forEach(sub => {
    const opt = document.createElement("option");
    opt.value = sub;
    opt.textContent = sub;
    select.appendChild(opt);
  });
}


/*************************************************
 * LOAD DATA
 *************************************************/
async function loadData() {
  const subject = document.getElementById("subject").value;
  if (!subject) return;

  const res = await fetch(API_URL + "?subject=" + subject);
  cache = await res.json();

  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  cache.forEach(row => {
    tbody.innerHTML += `
      <tr>
        <td>${row.code}</td>
        <td>
          <input type="number" value="${row.marks || ''}" data-code="${row.code}">
        </td>
      </tr>
    `;
  });
}


/*************************************************
 * SAVE DATA
 *************************************************/
async function saveData() {
  const subject = document.getElementById("subject").value;
  if (!subject) return alert("Select subject first");

  const inputs = document.querySelectorAll("input");

  const data = [];

  inputs.forEach(inp => {
    data.push({
      code: inp.dataset.code,
      marks: inp.value
    });
  });

  const res = await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      subject: subject,
      data: data
    })
  });

  const result = await res.json();

  alert(result.success ? "Saved successfully!" : "Error saving!");
}


/*************************************************
 * INIT
 *************************************************/
loadSubjects();

</script>

</body>
</html>
