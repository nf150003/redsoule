<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Marks Entry System</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#f5f7fb;
  min-height:100vh;
  padding:30px;
  color:#1f2937;
}

/* MAIN WRAPPER */
.wrapper{
  max-width:1000px;
  margin:auto;
}

/* HEADER */
.top-box{
  background:#ffffff;
  border:1px solid #e5e7eb;
  border-radius:18px;
  padding:25px;
  box-shadow:0 6px 20px rgba(0,0,0,0.06);
  margin-bottom:20px;
}

h2{
  font-size:26px;
  font-weight:700;
  margin-bottom:15px;
  color:#111827;
}

/* CONTROLS */
select{
  padding:12px 14px;
  border-radius:12px;
  border:1px solid #d1d5db;
  font-size:15px;
  min-width:220px;
  outline:none;
  background:#fff;
  transition:0.2s;
}

select:focus{
  border-color:#3b82f6;
  box-shadow:0 0 0 3px rgba(59,130,246,0.15);
}

button{
  padding:12px 18px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:600;
  transition:0.25s;
  font-size:14px;
}

/* SAVE BUTTON */
.save-btn{
  background:#2563eb;
  color:white;
  margin-left:10px;
  box-shadow:0 6px 15px rgba(37,99,235,0.2);
}

.save-btn:hover{
  background:#1d4ed8;
  transform:translateY(-1px);
}

/* TABLE BOX */
.table-box{
  background:#ffffff;
  border:1px solid #e5e7eb;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 6px 20px rgba(0,0,0,0.06);
}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:#f3f4f6;
  padding:14px;
  font-size:14px;
  text-transform:uppercase;
  letter-spacing:0.5px;
  color:#374151;
  border-bottom:1px solid #e5e7eb;
}

td{
  padding:12px;
  text-align:center;
  border-bottom:1px solid #f1f5f9;
  font-size:14px;
}

/* ROW HOVER */
tr:hover{
  background:#f9fafb;
}

/* CODE CELL STYLE */
td:first-child{
  font-weight:600;
  color:#2563eb;
}

/* INPUT */
input{
  width:120px;
  padding:8px 10px;
  border-radius:10px;
  border:1px solid #d1d5db;
  text-align:center;
  font-weight:600;
  outline:none;
  background:#fff;
  transition:0.2s;
}

input:focus{
  border-color:#3b82f6;
  box-shadow:0 0 0 3px rgba(59,130,246,0.15);
}

/* FOOTER */
.footer{
  text-align:center;
  margin-top:15px;
  font-size:12px;
  color:#6b7280;
}

/* RESPONSIVE */
@media(max-width:768px){
  .wrapper{
    padding:0;
  }

  select, button{
    width:100%;
    margin-top:10px;
  }

  .save-btn{
    margin-left:0;
  }

  input{
    width:100%;
  }
}
</style>
</head>

<body>

<div class="wrapper">

  <div class="top-box">
    <h2>🎓 Teacher Marks Entry Panel</h2>

    <select id="subject" onchange="loadData()">
      <option value="">Loading subjects...</option>
    </select>

    <button class="save-btn" onclick="saveData()">💾 Save Marks</button>
  </div>

  <div class="table-box">
    <table>
      <thead>
        <tr>
          <th>CODE</th>
          <th>MARKS</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="footer">
    NCPSC COLLEGE RESULT MANAGEMENT SYSTEM
  </div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzI1P_tYW3Fz8p-maDIv-Ms1pxXWMhHtOu1glBS_JkCAugzZ1XpdO6qfXkJ-vNkn99B/exec";

let cache = [];

/*************************************************
 * LOAD SUBJECTS
 *************************************************/
async function loadSubjects() {
  const res = await fetch(API_URL + "?action=subjects");
  const data = await res.json();

  const select = document.getElementById("subject");
  select.innerHTML = `<option value="">Select Subject</option>`;

  data.subjects.forEach(sub => {
    const opt = document.createElement("option");
    opt.value = sub;
    opt.textContent = sub;
    select.appendChild(opt);
  });
}

/*************************************************
 * LOAD DATA
 *************************************************/
async function loadData() {
  const subject = document.getElementById("subject").value;
  if (!subject) return;

  const res = await fetch(API_URL + "?subject=" + subject);
  cache = await res.json();

  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  cache.forEach(row => {
    tbody.innerHTML += `
      <tr>
        <td>${row.code}</td>
        <td>
          <input type="number" value="${row.marks || ''}" data-code="${row.code}">
        </td>
      </tr>
    `;
  });
}

/*************************************************
 * SAVE DATA
 *************************************************/
async function saveData() {
  const subject = document.getElementById("subject").value;
  if (!subject) return alert("Select subject first");

  const inputs = document.querySelectorAll("input");

  const data = [];

  inputs.forEach(inp => {
    data.push({
      code: inp.dataset.code,
      marks: inp.value
    });
  });

  const res = await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      subject: subject,
      data: data
    })
  });

  const result = await res.json();

  alert(result.success ? "Saved successfully!" : "Error saving!");
}

/*************************************************
 * INIT
 *************************************************/
loadSubjects();

</script>

</body>
</html>
