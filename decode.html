<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Marks Entry System</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Tinos:wght@400;700&display=swap');

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Tahoma, Arial, sans-serif;
}

body{
  background:#3a6ea5;
  background:linear-gradient(to bottom,#5c8fd8 0%,#3a6ea5 100%);
  min-height:100vh;
  padding:25px;
  color:#000;
}

/* MAIN WRAPPER */
.wrapper{
  max-width:1000px;
  margin:auto;
}

/* XP WINDOW */
.top-box,
.table-box{
  background:#ece9d8;
  border:2px solid #003c74;
  border-radius:8px;
  overflow:hidden;
  box-shadow:
    inset 1px 1px #ffffff,
    inset -1px -1px #7f9db9,
    5px 5px 15px rgba(0,0,0,.35);
}

/* XP TITLE BAR */
.top-box::before{
  content:"Marks Entry System";
  display:block;
  background:linear-gradient(to bottom,#0a246a,#3a6ea5);
  color:#fff;
  font-weight:bold;
  padding:8px 12px;
  font-size:13px;
}

.top-box{
  margin-bottom:15px;
}

h2{
  font-size:22px;
  padding:18px;
  color:#000;
  font-weight:bold;
}

/* CONTROLS */
select{
  margin-left:18px;
  margin-bottom:18px;
  padding:6px 8px;
  min-width:240px;
  border:2px inset #ffffff;
  background:#fff;
  font-size:13px;
  outline:none;
}

button{
  padding:6px 16px;
  border:2px outset #d4d0c8;
  background:#ece9d8;
  color:#000;
  font-weight:bold;
  cursor:pointer;
  font-size:13px;
}

button:hover{
  background:#f5f4ea;
}

button:active{
  border:2px inset #d4d0c8;
}

.save-btn{
  margin-left:10px;
}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
}

th{
  background:linear-gradient(to bottom,#f8f8f8,#dcdcdc);
  border:1px solid #808080;
  color:#000;
  padding:10px;
  font-size:13px;
  font-weight:bold;
}

td{
  border:1px solid #c0c0c0;
  padding:10px;
  text-align:center;
  font-size:13px;
}

tr:hover{
  background:#dbe8f6;
}

td:first-child{
  font-weight:bold;
  color:#003399;
}

/* INPUT */
input{
  width:120px;
  padding:5px;
  border:2px inset #ffffff;
  background:#fff;
  text-align:center;
  font-weight:bold;
  outline:none;
}

/* FOOTER */
.footer{
  text-align:center;
  margin-top:15px;
  font-size:12px;
  color:#fff;
  font-weight:bold;
  text-shadow:1px 1px 2px rgba(0,0,0,.7);
}

/* RESPONSIVE */
@media(max-width:768px){

  body{
    padding:10px;
  }

  select,
  button{
    width:calc(100% - 36px);
    margin:8px 18px;
  }

  .save-btn{
    margin-left:18px;
  }

  input{
    width:100%;
  }

  h2{
    font-size:18px;
  }
}
</style>
</head>

<body>

<div class="wrapper">

  <div class="top-box">
    <h2>🎓 Teacher Marks Entry Panel</h2>

    <select id="subject" onchange="loadData()">
      <option value="">Loading subjects...</option>
    </select>

    <button class="save-btn" onclick="saveData()">💾 Save Marks</button>
  </div>

  <div class="table-box">
    <table>
      <thead>
        <tr>
          <th>CODE</th>
          <th>MARKS</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="footer">
    NCPSC COLLEGE RESULT MANAGEMENT SYSTEM
  </div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbyemB7lZWC-nQSnqDehZorqr0lPAxNt7sn_2kbPmxR3WWKamxmBYY2qcq55Nx_Jq1Oj/exec";

let cache = [];

/*************************************************
 * LOAD SUBJECTS
 *************************************************/
async function loadSubjects() {
  const res = await fetch(API_URL + "?action=subjects");
  const data = await res.json();

  const select = document.getElementById("subject");
  select.innerHTML = `<option value="">Select Subject</option>`;

  data.subjects.forEach(sub => {
    const opt = document.createElement("option");
    opt.value = sub;
    opt.textContent = sub;
    select.appendChild(opt);
  });
}

/*************************************************
 * LOAD DATA
 *************************************************/
async function loadData() {
  const subject = document.getElementById("subject").value;
  if (!subject) return;

  const res = await fetch(API_URL + "?subject=" + subject);
  cache = await res.json();

  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  cache.forEach(row => {
    tbody.innerHTML += `
      <tr>
        <td>${row.code}</td>
        <td>
          <input type="number" value="${row.marks || ''}" data-code="${row.code}">
        </td>
      </tr>
    `;
  });
}

/*************************************************
 * SAVE DATA
 *************************************************/
async function saveData() {
  const subject = document.getElementById("subject").value;
  if (!subject) return alert("Select subject first");

  const inputs = document.querySelectorAll("input");

  const data = [];

  inputs.forEach(inp => {
    data.push({
      code: inp.dataset.code,
      marks: inp.value
    });
  });

  const res = await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      subject: subject,
      data: data
    })
  });

  const result = await res.json();

  alert(result.success ? "Saved successfully!" : "Error saving!");
}

/*************************************************
 * INIT
 *************************************************/
loadSubjects();

</script>

</body>
</html>
