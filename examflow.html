<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>পরীক্ষার ফ্লোচার্ট ২০২৬</title>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:"Hind Siliguri","Noto Sans Bengali",Arial,sans-serif;
    background:#f4f6f9;
    color:#222;
}

.container{
    max-width:650px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
    font-size:22px;
    font-weight:700;
}

.box{
    padding:14px;
    margin:16px 0;
    border-radius:14px;
    cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

.blue{background:#e3f2fd;border:2px solid #1976d2;}
.green{background:#e8f5e9;border:2px solid #2e7d32;}
.orange{background:#fff3e0;border:2px solid #ef6c00;}
.purple{background:#f3e5f5;border:2px solid #6a1b9a;}
.red{background:#ffebee;border:2px solid #c62828;}
.teal{background:#e0f2f1;border:2px solid #00796b;}
.indigo{background:#e8eaf6;border:2px solid #3f51b5;}
.pink{background:#fce4ec;border:2px solid #ad1457;}
.cyan{background:#e0f7fa;border:2px solid #006064;}

.title{font-size:19px;font-weight:700;}
.date{font-size:14px;color:#444;}

.subflow{display:none;margin-top:10px;}

.sub{
    background:#fff;
    margin:5px 0;
    padding:9px;
    border-radius:10px;
    border-left:4px solid #555;
}

.arrow{
    text-align:center;
    font-size:22px;
    margin:5px 0;
}

</style>
</head>

<body>

<div class="container">
<h1>📚 পরীক্ষার ফ্লোচার্ট ২০২৬</h1>
<div id="flowchart">Loading...</div>
</div>

<script>

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbzv-_90ktjXnD9U4zgsQPVsEqFIljR8CrhAw6ihkOkovNd1JJqHFgiIfpS4OlcUw9fq/exec?action=getFlowchartData";

// SAFE FETCH (GitHub compatible)
fetch(WEB_APP_URL)
.then(res => res.text())
.then(text => {
    let data;
    try {
        data = JSON.parse(text);
    } catch (e) {
        console.log("RAW:", text);
        data = [];
    }
    render(data);
})
.catch(err => console.log(err));

function render(data){

    const box = document.getElementById("flowchart");
    box.innerHTML = "";

    if (!Array.isArray(data) || data.length === 0) {
        box.innerHTML = "No data found";
        return;
    }

    data.forEach((item, i) => {

        const steps = item.steps || [];

        let html = `
        <div class="box ${item.color || 'blue'}" onclick="toggle(this)">
            <div class="title">${item.title || ''}</div>
            <div class="date">${item.date || ''}</div>

            <div class="subflow">
                ${steps.map(s => `<div class="sub">${s}</div>`).join("")}
            </div>
        </div>
        `;

        if (i < data.length - 1) {
            html += `<div class="arrow">⬇️</div>`;
        }

        box.insertAdjacentHTML("beforeend", html);
    });
}

function toggle(el){
    const sub = el.querySelector(".subflow");
    sub.style.display = sub.style.display === "block" ? "none" : "block";
}

</script>

</body>
</html>
