<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academic Timeline</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:"Noto Sans Bengali","Hind Siliguri",sans-serif;
    background: linear-gradient(135deg,#f5f7ff,#fdf2f8,#f0fdfa);
    color:#1f2937;
    line-height:1.6;
}

h1{
    margin:0;
    padding:20px;
    text-align:center;
    font-size:22px;
    font-weight:800;
    color:#fff;
    background: linear-gradient(90deg,#1e3a8a,#2563eb,#0ea5e9,#14b8a6);
    box-shadow:0 6px 18px rgba(0,0,0,0.15);
}

.container{
    max-width:860px;
    margin:auto;
    padding:22px 14px;
}

.timeline{
    position:relative;
    margin:0;
    padding:0;
}

.card{
    position:relative;
    background:#fff;
    margin:18px auto;
    border-radius:14px;
    padding:18px;
    box-shadow:0 10px 22px rgba(0,0,0,0.08);
    cursor:pointer;
    width:92%;

    opacity:0;
    transform:translateY(18px);
    animation:fadeUp 0.6s ease forwards;

    transition:transform 0.25s ease, box-shadow 0.25s ease;
    will-change: transform;
}

@keyframes fadeUp{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.card:hover{
    transform:translateY(-4px);
    box-shadow:0 14px 30px rgba(0,0,0,0.12);
}

.dot{
    position:absolute;
    left:-36px;
    top:22px;
    width:28px;
    height:28px;
    border-radius:50%;
    background: radial-gradient(circle at 30% 30%, #22c55e, #16a34a);
    border:3px solid #ffffff;
    box-shadow:0 0 0 3px #15803d;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:13px;
    font-weight:900;
    color:#fff;
}

.main{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:700;
    font-size:15px;
    gap:14px;
}

.main div{
    flex:1;
    text-align:center;
}

.details{
    max-height:0;
    overflow:hidden;
    opacity:0;
    transition:all 0.45s ease;
}

.card.active .details{
    max-height:500px;
    opacity:1;
    margin-top:12px;
    padding-top:10px;
    border-top:1px solid #e5e7eb;
}

.step{
    background: linear-gradient(135deg,#eff6ff,#fdf4ff,#ecfeff);
    margin:8px 0;
    padding:12px 14px;
    border-radius:10px;
    font-size:14px;
    border-left:4px solid #0ea5e9;
}

/* ONLY ONE SUBFLOW HIGHLIGHT */
.step.highlight{
    color:#ef4444;
    font-weight:800;
}

.card.done{
    opacity:0.5;
    filter:grayscale(1);
}

.card.today{
    border-left:6px solid #ef4444 !important;
    box-shadow:0 0 18px rgba(239,68,68,0.4);
}

.card.upcoming:hover{
    transform:scale(1.01);
}

@media (max-width: 600px){

    .card{
        width:92%;
        margin:18px auto;
        padding:26px 14px 18px;
    }

    .dot{
        left:50%;
        transform:translateX(-50%);
        top:-14px;
    }

    .main{
        flex-direction:column;
        gap:6px;
    }
}

</style>
</head>

<body>

<h1>Academic Timeline</h1>

<div class="container">
    <div class="timeline" id="app">Loading...</div>
</div>

<script>

const URL = "https://script.google.com/macros/s/AKfycbxp0_D6uxAXA35FPk0hXy21y6idtcfuy5UvQQcewBwywYp66vpHpdFvFR4cV6CB4IYL/exec?action=getFlowchartData";

const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

function parseDate(str){
    const m = str.match(/(\d{4})-(\d{2})-(\d{2})/);
    if(!m) return null;
    return new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));
}

function formatDate(input){
    if(!input) return "";

    const match = input.match(/(\d{4})-(\d{2})-(\d{2})/);
    if(!match) return input;

    const y = match[1], m = match[2], d = match[3];
    const dateObj = new Date(Number(y), Number(m)-1, Number(d));
    const weekday = days[dateObj.getDay()];

    return `${d}/${m}/${y} (${weekday})`;
}

function render(data){

    const box = document.getElementById("app");
    box.innerHTML = "";

    let now = new Date();

    data.forEach((row,index)=>{

        const keys = Object.keys(row);

        const mainDate = parseDate(row[keys[0]]);
        let status = "";
        let countdown = "";

        if(mainDate){
            const diff = Math.ceil((mainDate - now) / (1000*60*60*24));

            if(diff < 0) status = "done";
            else if(diff === 0) status = "today";
            else {
                status = "upcoming";
                countdown = `⏳ ${diff} days left`;
            }
        }

        const main1 = formatDate(row[keys[0]] || "");
        const main2 = formatDate(row[keys[1]] || "");

        // 🔥 FIND ONLY ONE NEAREST SUBFLOW DATE
        const subKeys = keys.slice(2);

        let nearestIndex = -1;
        let nearestDiff = Infinity;

        subKeys.forEach((k, i)=>{
            const d = parseDate(row[k]);
            if(d){
                const diff = (d - now);
                if(diff >= 0 && diff < nearestDiff){
                    nearestDiff = diff;
                    nearestIndex = i;
                }
            }
        });

        let steps = "";
        subKeys.forEach((k,i)=>{
            if(row[k]){
                const isHighlight = (i === nearestIndex);
                steps += `<div class="step ${isHighlight ? "highlight" : ""}">${k} : ${formatDate(row[k])}</div>`;
            }
        });

        const html = `
        <div class="card ${status}" onclick="this.classList.toggle('active')" style="animation-delay:${index*0.05}s">

            <div class="dot">${index+1}</div>

            <div class="main">
                <div>${main1}</div>
                <div>${main2}</div>
            </div>

            ${countdown ? `<div style="text-align:center;color:#f59e0b;font-weight:700;margin-top:6px">${countdown}</div>` : ""}

            <div class="details">
                ${steps}
            </div>

        </div>
        `;

        box.insertAdjacentHTML("beforeend", html);
    });
}

fetch(URL).then(r=>r.json()).then(render);

</script>

</body>
</html>
