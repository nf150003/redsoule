<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Flow 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:"Hind Siliguri",sans-serif;
    background:linear-gradient(135deg,#eef2ff,#fdf2f8,#ecfeff);
    min-height:100vh;
}

.container{
    max-width:750px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
    font-size:26px;
    font-weight:800;
    margin-bottom:20px;
    color:#111;
}

/* FLOW CARD */
.card{
    background:#fff;
    margin:18px 0;
    border-radius:18px;
    padding:16px;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
    cursor:pointer;
    transition:0.25s;
    border-left:6px solid #6366f1;
}

.card:hover{
    transform:translateY(-2px);
}

/* MAIN FLOW CENTER */
.main{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:700;
    font-size:18px;
    text-align:center;
}

.main div{
    flex:1;
}

/* ARROW BETWEEN */
.arrow{
    font-size:22px;
    color:#6366f1;
}

/* DETAILS */
.details{
    display:none;
    margin-top:12px;
    padding-top:12px;
    border-top:1px dashed #ddd;
}

/* STEP STYLE */
.step{
    background:linear-gradient(90deg,#f0f9ff,#fdf4ff);
    margin:6px 0;
    padding:10px;
    border-radius:12px;
    font-size:15px;
    border-left:4px solid #06b6d4;
}

/* COLORS RANDOM FEEL */
.card:nth-child(4n){
    border-left-color:#f97316;
}
.card:nth-child(4n+1){
    border-left-color:#22c55e;
}
.card:nth-child(4n+2){
    border-left-color:#a855f7;
}
.card:nth-child(4n+3){
    border-left-color:#ef4444;
}

/* MOBILE */
@media(max-width:600px){
    .main{
        font-size:16px;
        flex-direction:column;
        gap:5px;
    }
}

</style>
</head>

<body>

<div class="container">
<h1>📊 Exam Flow 2026</h1>
<div id="app">Loading...</div>
</div>

<script>

const URL = "https://script.google.com/macros/s/AKfycbwnGyCREymDg4VeAyIqCyB027jv5-jofIzJpH9HmEUvkJ_tI-Od3bm8fQue3nr73gy_/exec?action=getFlowchartData";

fetch(URL)
.then(r => r.json())
.then(render)
.catch(() => {
    document.getElementById("app").innerHTML = "Failed to load data";
});

function render(data){

    const box = document.getElementById("app");
    box.innerHTML = "";

    data.forEach(row => {

        const keys = Object.keys(row);

        const main1 = row[keys[0]] || "";
        const main2 = row[keys[1]] || "";

        let stepsHTML = "";

        keys.slice(2).forEach(k => {
            if(row[k]){
                stepsHTML += `<div class="step">${k} : ${row[k]}</div>`;
            }
        });

        const html = `
        <div class="card" onclick="toggle(this)">
            <div class="main">
                <div>${main1}</div>
                <div class="arrow">⬇</div>
                <div>${main2}</div>
            </div>

            <div class="details">
                ${stepsHTML}
            </div>
        </div>
        `;

        box.insertAdjacentHTML("beforeend", html);
    });
}

function toggle(el){
    const d = el.querySelector(".details");
    d.style.display = (d.style.display === "block") ? "none" : "block";
}

</script>

</body>
</html>
