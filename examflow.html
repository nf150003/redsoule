<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowchart</title>

<style>
body{
  font-family: Arial, sans-serif;
  margin:0;
  background:#f4f6f9;
}

.container{
  max-width:700px;
  margin:auto;
  padding:20px;
}

h1{
  text-align:center;
}

.card{
  background:white;
  margin:12px 0;
  padding:12px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
  cursor:pointer;
}

.main{
  display:flex;
  justify-content:space-between;
  font-weight:bold;
}

.details{
  display:none;
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid #ddd;
}

.step{
  padding:4px 0;
}
</style>
</head>

<body>

<div class="container">
<h1>Exam Flow</h1>
<div id="app">Loading...</div>
</div>

<script>

const URL = "YOUR_WEB_APP_URL_HERE?action=getFlowchartData";

fetch(URL)
.then(r => r.json())
.then(render)
.catch(err => {
  document.getElementById("app").innerHTML = "Error loading data";
});

function render(data){

  const box = document.getElementById("app");
  box.innerHTML = "";

  data.forEach(row => {

    const keys = Object.keys(row);

    const exam = row[keys[0]] || "";
    const date = row[keys[1]] || "";

    let stepsHTML = "";

    keys.slice(2).forEach(k => {
      if(row[k]){
        stepsHTML += `<div class="step">${k} : ${row[k]}</div>`;
      }
    });

    const html = `
      <div class="card" onclick="toggle(this)">
        <div class="main">
          <div>${exam}</div>
          <div>${date}</div>
        </div>

        <div class="details">
          ${stepsHTML}
        </div>
      </div>
    `;

    box.insertAdjacentHTML("beforeend", html);
  });
}

function toggle(el){
  const d = el.querySelector(".details");
  d.style.display = (d.style.display === "block") ? "none" : "block";
}

</script>

</body>
</html>
