<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Education Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:#eef2f7;
  color:#1f2937;
}

/* HEADER */
.header{
  background:#1e3a8a;
  color:#ffffff;
  text-align:center;
  padding:24px 16px;
  font-size:20px;
  font-weight:600;
  letter-spacing:0.8px;
  border-bottom:4px solid #0f172a;
}

/* CONTAINER */
.container{
  padding:30px;
  max-width:600px;
  margin:auto;
}

/* GRID (slightly tighter) */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

/* SMALL FORMAL BUTTON */
.btn{
  background:#ffffff;
  border:1px solid #d1d5db;
  border-radius:8px;
  padding:14px 10px;
  font-size:12px;
  font-weight:500;
  color:#111827;
  text-align:center;
  cursor:pointer;
  transition:0.2s ease;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  text-decoration:none;
  box-shadow:0 1px 4px rgba(0,0,0,0.06);
}

.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 14px rgba(0,0,0,0.10);
  border-color:#2563eb;
}

/* ICON SMALLER */
.icon{
  width:38px;
  height:38px;
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#ffffff;
  font-size:16px;
  margin-bottom:6px;
}

/* COLORS (UNCHANGED LOGIC) */
.c1{background:#dc2626;}
.c2{background:#1d4ed8;}
.c3{background:#15803d;}
.c4{background:#b45309;}
.c5{background:#6d28d9;}
.c6{background:#0f766e;}
.c7{background:#c2410c;}
.c8{background:#4338ca;}
.c9{background:#be185d;}
.c10{background:#0369a1;}

a{
  text-decoration:none;
}
</style>
</head>

<body>

<div class="header">
  EXAMINATION MANAGEMENT PANEL
</div>

<div class="container">

  <div class="grid">

    <!-- Send Report -->
    <a class="btn" href="#" onclick="sendReport(event)">
      <div class="icon c1">📊</div>
      CT Report
    </a>

    <!-- Leaderboard -->
    <a class="btn" href="https://docs.google.com/spreadsheets/d/1eVfzUfSB1W00rZz-xEXkSUHj3dr511BhSK6mMB8yS7o/edit?gid=0#gid=0" target="_blank">
      <div class="icon c2">🏆</div>
      Leaderboard
    </a>

    <!-- Lesson Plan -->
    <a class="btn" href="#" onclick="generatePDF(event)">
      <div class="icon c3">📚</div>
      Lesson Plan
    </a>

    <!-- Seat Plan -->
    <a class="btn" href="#" onclick="runSeatPlan(event)">
      <div class="icon c4">🪑</div>
      Seat Plan
    </a>

    <a class="btn" href="#"><div class="icon c5">📝</div>Exams</a>
    <a class="btn" href="#"><div class="icon c6">📄</div>Results</a>
    <a class="btn" href="#"><div class="icon c7">📌</div>Notices</a>
    <a class="btn" href="#"><div class="icon c8">⚙️</div>Settings</a>
    <a class="btn" href="#"><div class="icon c9">👨‍🏫</div>Teachers</a>
    <a class="btn" href="#"><div class="icon c10">📱</div>App Info</a>

  </div>

</div>

<script>
function sendReport(e){
  e.preventDefault();

  const url = "https://script.google.com/macros/s/AKfycbyMqNARUd91z_EPpEyh91ACwqYtGE7Xz-5xXDdDYjIwoAT3BPeFz93kQsOKYywuMfLd/exec";

  alert("Processing request...");

  fetch(url)
    .then(res => res.text())
    .then(text => {
      let data;
      try { data = JSON.parse(text); }
      catch(e){ data = {status:"error", message:text}; }

      alert((data.status === "success" ? "SUCCESS: " : "ERROR: ") + data.message);
    })
    .catch(err => {
      console.log(err);
      alert("Network error occurred");
    });
}

function generatePDF(e){
  e.preventDefault();

  const url = "https://script.google.com/macros/s/AKfycbzUVnC6nBfLWr2TdA0WYCdewrni8Zyc1H6FUZrFfGV-cfr1oAPkQPwelzLlqRlaXJxN/exec";

  alert("Generating document...");

  fetch(url + "?action=generateAndSendPDF")
    .then(res => res.text())
    .then(() => alert("Lesson Plan generated successfully"))
    .catch(() => alert("Failed to generate document"));
}

function runSeatPlan(e){
  e.preventDefault();

  const url = "https://script.google.com/macros/s/AKfycbzGoYon_BYBlhfjmt5Y50W0Y4gOUUAZZXxboraXAq5zTJugmmn4sM8PhMD5yYkjpMRZ/exec";

  alert("Processing seat plan...");

  fetch(url + "?action=seatplan")
    .then(res => res.text())
    .then(data => {
      alert(data);
      console.log(data);
    })
    .catch(err => {
      alert("Seat plan failed");
    });
}
</script>

</body>
</html>
