<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>নির্ঝর ক্যান্টনমেন্ট পাবলিক স্কুল ও কলেজ</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

/* =======================
   GLOBAL STYLE
======================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(135deg,#f9fbff,#ffffff,#f4f7ff);
    min-height:100vh;
    color:#2c3e50;
}

/* =======================
   TOP HEADER
======================= */
.topbar{
    background:linear-gradient(135deg,#6c7ce0,#8e9fff);
    color:white;
    padding:18px;
    text-align:center;
}

.topbar h1{
    font-size:20px;
    letter-spacing:1px;
}

.topbar p{
    font-size:13px;
    opacity:0.95;
}

/* =======================
   CONTAINER
======================= */
.container{
    max-width:1050px;
    margin:auto;
    padding:20px;
}

/* =======================
   CARD
======================= */
.card{
    background:white;
    border-radius:18px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 8px 20px rgba(0,0,0,0.05);
    border:1px solid #eef2ff;
}

/* =======================
   FORM ELEMENTS
======================= */
label{
    display:block;
    margin-top:10px;
    font-size:13px;
    font-weight:500;
    color:#4a5568;
}

select, textarea{
    width:100%;
    margin-top:6px;
    padding:12px;
    border-radius:12px;
    border:1px solid #e6eaf5;
    outline:none;
    background:#f9fbff;
    font-size:14px;
}

textarea{
    height:140px;
    resize:none;
}

/* =======================
   BUTTONS
======================= */
button{
    border:none;
    border-radius:10px;
    padding:12px 14px;
    cursor:pointer;
    background:linear-gradient(135deg,#6c7ce0,#8e9fff);
    color:white;
    font-weight:500;
    transition:0.3s;
}

button:hover{
    opacity:0.9;
    transform:scale(1.02);
}

</style>
</head>

<body>

<div class="topbar">
    <h1>নির্ঝর ক্যান্টনমেন্ট পাবলিক স্কুল ও কলেজ</h1>
    <p>বন্ধের পড়া</p>
</div>

<div class="container">

    <div class="card">

        <label>বিষয় নির্বাচন করুন</label>
        <select>
            <option>বাংলা</option>
            <option>ইংরেজি</option>
            <option>গণিত</option>
            <option>উদ্ভিদবিজ্ঞান</option>
            <option>প্রাণিবিজ্ঞান</option>
            <option>পদার্থবিজ্ঞান</option>
            <option>রসায়ন</option>
            <option>তথ্য ও যোগাযোগ প্রযুক্তি (আইসিটি)</option>
        </select>

        <label>পাঠ পরিকল্পনা</label>
        <textarea placeholder="এখানে লিখুন..."></textarea>

        <button>সংরক্ষণ করুন</button>

    </div>

</div>

</body>
</html>
