<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Library Due Dashboard</title>

<style>

body{
    font-family:Arial, sans-serif;
    background:#f4f6fb;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
}

h2{
    color:#1e3a8a;
    margin-bottom:10px;
}

.search-box{
    width:100%;
    padding:12px;
    margin:10px 0 20px;
    border:1px solid #ccc;
    border-radius:8px;
    outline:none;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    border-radius:10px;
    overflow:hidden;
}

th{
    background:#1e3a8a;
    color:white;
    padding:12px;
    text-align:left;
}

td{
    padding:10px;
    border-bottom:1px solid #eee;
    font-size:14px;
}

select{
    width:100%;
    padding:6px;
    border-radius:6px;
}

button{
    background:#16a34a;
    color:white;
    border:none;
    padding:6px 10px;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#15803d;
}

.loading{
    text-align:center;
    padding:20px;
    color:#555;
}

</style>

</head>

<body>

<div class="container">

<h2>📚 Library Due Books Dashboard</h2>

<input
    type="text"
    id="search"
    class="search-box"
    placeholder="Search by Code or ID..."
    onkeyup="filterData()"
/>

<table>

<thead>
<tr>
    <th>S/L</th>
    <th>Code</th>
    <th>ID</th>
    <th>Borrow Date</th>
    <th>Status</th>
    <th>Save</th>
</tr>
</thead>

<tbody id="tableBody">
<tr><td colspan="6" class="loading">Loading data...</td></tr>
</tbody>

</table>

</div>

<script>

const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzKhUg5AEnNKu-PhnlKE74QfFckqVzzBl9jyKFZ3iN-QsTF7nU_kHo5DPQ3DiC-yvkCEA/exec";

let allData = [];


// =====================
// LOAD DATA (doGet)
// =====================
async function loadData(){

    try{

        const res = await fetch(WEB_APP_URL + "?action=getData");

        const data = await res.json();

        allData = data;

        render(allData);

    }catch(err){

        document.getElementById("tableBody").innerHTML =
        `<tr><td colspan="6" class="loading">Failed to load data</td></tr>`;

        console.log(err);
    }
}


// =====================
// RENDER TABLE
// =====================
function render(data){

    let html = "";

    data.forEach(row=>{

        html += `
        <tr>

            <td>${row["S/L"] || ""}</td>
            <td>${row["Code"] || ""}</td>
            <td>${row["ID"] || ""}</td>
            <td>${row["Borrow Date"] || ""}</td>

            <td>
                <select id="status-${row["_row"]}">
                    ${statusOptions(row["Status"])}
                </select>
            </td>

            <td>
                <button onclick="save('${row["Code"]}',${row["_row"]})">
                    Save
                </button>
            </td>

        </tr>
        `;
    });

    document.getElementById("tableBody").innerHTML = html;
}


// =====================
// STATUS DROPDOWN
// =====================
function statusOptions(current){

    const list = ["Due","Borrowed","Submitted","Lost","Damaged"];

    return list.map(s =>
        `<option ${s===current?"selected":""}>${s}</option>`
    ).join("");
}


// =====================
// SEARCH FUNCTION
// =====================
function filterData(){

    const key = document.getElementById("search").value.toLowerCase();

    const filtered = allData.filter(r =>
        (r["Code"]||"").toLowerCase().includes(key) ||
        (r["ID"]||"").toLowerCase().includes(key)
    );

    render(filtered);
}


// =====================
// SAVE (doPost → EMAIL handled backend)
// =====================
async function save(code,row){

    const status = document.getElementById("status-"+row).value;

    try{

        await fetch(WEB_APP_URL,{
            method:"POST",
            body: JSON.stringify({
                action:"updateStatus",
                code: code,
                status: status
            })
        });

        alert("Updated & Email Sent (if configured)");

    }catch(err){
        alert("Update failed");
        console.log(err);
    }
}


// INIT
loadData();

</script>

</body>
</html>
