<!-- index.html -->

<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Library Borrowed Book System</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#edf2f7;
    padding:20px;
    color:#1e293b;
}

.container{
    max-width:1300px;
    margin:auto;
}

.header{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 4px 18px rgba(0,0,0,0.08);
    margin-bottom:20px;
}

.header h1{
    color:#1d4ed8;
    font-size:30px;
    margin-bottom:18px;
}

.search-area{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.search-area input{
    flex:1;
    min-width:240px;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#f1f5f9;
    font-size:15px;
    outline:none;
}

.search-area button{
    padding:14px 22px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-weight:600;
    transition:0.3s;
}

.search-btn{
    background:#2563eb;
    color:white;
}

.search-btn:hover{
    background:#1d4ed8;
}

.reload-btn{
    background:#0f766e;
    color:white;
}

.reload-btn:hover{
    background:#115e59;
}

.table-box{
    overflow:auto;
    background:white;
    border-radius:20px;
    box-shadow:0 4px 18px rgba(0,0,0,0.08);
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1200px;
}

thead{
    background:#1e3a8a;
    color:white;
}

th,td{
    padding:15px;
    text-align:left;
    font-size:14px;
}

tbody tr:nth-child(even){
    background:#f8fafc;
}

tbody tr:hover{
    background:#dbeafe;
}

.status-select{
    width:100%;
    padding:10px;
    border-radius:10px;
    border:none;
    background:#f1f5f9;
    outline:none;
}

.save-btn{
    background:#16a34a;
    color:white;
    border:none;
    padding:10px 16px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
}

.save-btn:hover{
    background:#15803d;
}

.loading{
    text-align:center;
    padding:30px;
    font-weight:600;
    color:#64748b;
}

@media(max-width:768px){

    .search-area{
        flex-direction:column;
    }

    .search-area button{
        width:100%;
    }
}

</style>
</head>
<body>

<div class="container">

    <div class="header">

        <h1>📚 Library Borrowed Book Management</h1>

        <div class="search-area">

            <input 
                type="text"
                id="searchInput"
                placeholder="Search by Book / ID / Code"
            >

            <button class="search-btn" onclick="searchBooks()">
                Search
            </button>

            <button class="reload-btn" onclick="loadData()">
                Reload
            </button>

        </div>

    </div>

    <div class="table-box">

        <table>

            <thead>

                <tr>
                    <th>S/L</th>
                    <th>Code</th>
                    <th>ID</th>
                    <th>Borrow Date</th>
                    <th>Submission Date</th>
                    <th>Status</th>
                    <th>Book</th>
                    <th>Price</th>
                    <th>E-mail</th>
                    <th>Save</th>
                </tr>

            </thead>

            <tbody id="tableBody">

                <tr>
                    <td colspan="10" class="loading">
                        Loading Data...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>

<script>

const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzKhUg5AEnNKu-PhnlKE74QfFckqVzzBl9jyKFZ3iN-QsTF7nU_kHo5DPQ3DiC-yvkCEA/exec";

let allData = [];

async function loadData(){

    document.getElementById("tableBody").innerHTML = `
        <tr>
            <td colspan="10" class="loading">
                Loading Data...
            </td>
        </tr>
    `;

    try{

        const response = await fetch(
            WEB_APP_URL + "?action=getBorrowed"
        );

        const data = await response.json();

        allData = data;

        displayData(allData);

    }catch(error){

        console.log(error);

        document.getElementById("tableBody").innerHTML = `
            <tr>
                <td colspan="10" class="loading">
                    Failed to Load Data
                </td>
            </tr>
        `;
    }
}


function displayData(data){

    const tableBody = document.getElementById("tableBody");

    if(data.length === 0){

        tableBody.innerHTML = `
            <tr>
                <td colspan="10" class="loading">
                    No Data Found
                </td>
            </tr>
        `;

        return;
    }

    let html = "";

    data.forEach((row,index)=>{

        html += `

            <tr>

                <td>${row["S/L"] || ""}</td>
                <td>${row["Code"] || ""}</td>
                <td>${row["ID"] || ""}</td>
                <td>${row["Borrow Date"] || ""}</td>
                <td>${row["Submission Date"] || ""}</td>

                <td>

                    <select class="status-select" id="status-${index}">

                        <option value="Borrowed"
                            ${row["Status"]==="Borrowed"?"selected":""}>
                            Borrowed
                        </option>

                        <option value="Submitted"
                            ${row["Status"]==="Submitted"?"selected":""}>
                            Submitted
                        </option>

                        <option value="Lost"
                            ${row["Status"]==="Lost"?"selected":""}>
                            Lost
                        </option>

                        <option value="Damaged"
                            ${row["Status"]==="Damaged"?"selected":""}>
                            Damaged
                        </option>

                    </select>

                </td>

                <td>${row["Book"] || ""}</td>
                <td>${row["Price"] || ""}</td>
                <td>${row["E-mail"] || ""}</td>

                <td>

                    <button 
                        class="save-btn"
                        onclick="saveStatus('${row["Code"]}',${index})"
                    >
                        Save
                    </button>

                </td>

            </tr>

        `;
    });

    tableBody.innerHTML = html;
}


function searchBooks(){

    const keyword = document
        .getElementById("searchInput")
        .value
        .toLowerCase();

    const filtered = allData.filter(row =>

        (row["Book"] || "")
        .toLowerCase()
        .includes(keyword)

        ||

        (row["Code"] || "")
        .toLowerCase()
        .includes(keyword)

        ||

        (row["ID"] || "")
        .toLowerCase()
        .includes(keyword)
    );

    displayData(filtered);
}


async function saveStatus(code,index){

    const status = document
        .getElementById(`status-${index}`)
        .value;

    try{

        const response = await fetch(WEB_APP_URL,{

            method:"POST",

            body:JSON.stringify({
                action:"updateStatus",
                code:code,
                status:status
            })

        });

        const result = await response.text();

        alert("✅ Status Updated Successfully");

        console.log(result);

    }catch(error){

        console.log(error);

        alert("❌ Failed to Update Status");
    }
}

loadData();

</script>

</body>
</html>
