<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Borrowed Books</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

body{
    font-family:Poppins,sans-serif;
    background:#f4f6fb;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
}

h1{
    color:#1d4ed8;
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    border-radius:12px;
    overflow:hidden;
}

th{
    background:#1e3a8a;
    color:white;
    padding:12px;
}

td{
    padding:12px;
    border-bottom:1px solid #eee;
    font-size:14px;
}

.status-select{
    width:100%;
    padding:6px;
}

.save-btn{
    background:#16a34a;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
}

.save-btn:hover{
    background:#15803d;
}

</style>

</head>

<body>

<div class="container">

<h1>📚 Borrowed Books</h1>

<table>

<thead>
<tr>
    <th>S/L</th>
    <th>Code</th>
    <th>ID</th>
    <th>Borrow Date</th>
    <th>Status</th>
    <th>Save</th>
</tr>
</thead>

<tbody id="tableBody">
<tr><td colspan="6">Loading...</td></tr>
</tbody>

</table>

</div>

<script>

const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzKhUg5AEnNKu-PhnlKE74QfFckqVzzBl9jyKFZ3iN-QsTF7nU_kHo5DPQ3DiC-yvkCEA/exec";

let allData = [];

async function loadData(){

    const res = await fetch(WEB_APP_URL + "?action=getBorrowed");
    const data = await res.json();

    allData = data;
    render(data);
}

function render(data){

    let html = "";

    data.forEach((row,i)=>{

        html += `
        <tr>
            <td>${row["S/L"] || ""}</td>
            <td>${row["Code"] || ""}</td>
            <td>${row["ID"] || ""}</td>
            <td>${row["Borrow Date"] || ""}</td>

            <td>
                <select id="st-${i}" class="status-select">
                    <option ${row["Status"]==="Borrowed"?"selected":""}>Borrowed</option>
                    <option ${row["Status"]==="Submitted"?"selected":""}>Submitted</option>
                    <option ${row["Status"]==="Lost"?"selected":""}>Lost</option>
                    <option ${row["Status"]==="Damaged"?"selected":""}>Damaged</option>
                </select>
            </td>

            <td>
                <button class="save-btn" onclick="save('${row["Code"]}',${i})">
                    Save
                </button>
            </td>
        </tr>
        `;
    });

    document.getElementById("tableBody").innerHTML = html;
}

async function save(code,i){

    const status = document.getElementById("st-"+i).value;

    await fetch(WEB_APP_URL,{
        method:"POST",
        body:JSON.stringify({
            action:"updateStatus",
            code:code,
            status:status
        })
    });

    alert("Updated");
}

loadData();

</script>

</body>
</html>
