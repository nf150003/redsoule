<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Due Books Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

body{
    font-family:Poppins,sans-serif;
    background:#f4f6fb;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
}

h2{
    color:#1d4ed8;
    margin-bottom:10px;
}

.search-box{
    width:100%;
    padding:12px;
    margin:15px 0;
    border-radius:10px;
    border:1px solid #ccc;
    outline:none;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    border-radius:10px;
    overflow:hidden;
}

th{
    background:#1e3a8a;
    color:white;
    padding:10px;
    font-size:14px;
}

td{
    padding:10px;
    border-bottom:1px solid #eee;
    font-size:14px;
}

select{
    width:100%;
    padding:6px;
    border-radius:6px;
}

button{
    background:#16a34a;
    color:white;
    border:none;
    padding:6px 10px;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#15803d;
}

.loading{
    text-align:center;
    padding:20px;
    color:#555;
}

</style>

</head>

<body>

<div class="container">

<h2>📚 Due Books Dashboard</h2>

<input
    type="text"
    id="search"
    class="search-box"
    placeholder="Search by Code or ID..."
    onkeyup="filterData()"
/>

<table>

<thead>
<tr>
    <th>S/L</th>
    <th>Code</th>
    <th>ID</th>
    <th>Borrow Date</th>
    <th>Status</th>
    <th>Save</th>
</tr>
</thead>

<tbody id="tableBody">
<tr><td colspan="6" class="loading">Loading...</td></tr>
</tbody>

</table>

</div>

<script>

const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzKhUg5AEnNKu-PhnlKE74QfFckqVzzBl9jyKFZ3iN-QsTF7nU_kHo5DPQ3DiC-yvkCEA/exec";

let allData = [];

// LOAD DATA
async function loadData(){

    try{

        const res = await fetch(WEB_APP_URL + "?action=getData");
        allData = await res.json();

        render(allData);

    }catch(err){

        document.getElementById("tableBody").innerHTML =
        `<tr><td colspan="6" class="loading">Failed to load</td></tr>`;
    }
}


// RENDER TABLE
function render(data){

    let html = "";

    data.forEach((row,i)=>{

        html += `
        <tr>
            <td>${row["S/L"] || ""}</td>
            <td>${row["Code"] || ""}</td>
            <td>${row["ID"] || ""}</td>
            <td>${row["Borrow Date"] || ""}</td>

            <td>
                <select id="status-${i}">
                    ${statusOptions(row["Status"])}
                </select>
            </td>

            <td>
                <button onclick="save('${row["Code"]}',${i})">
                    Save
                </button>
            </td>
        </tr>
        `;
    });

    document.getElementById("tableBody").innerHTML = html;
}


// STATUS DROPDOWN
function statusOptions(current){

    const list = ["Due","Borrowed","Submitted","Lost","Damaged"];

    return list.map(s =>
        `<option ${s===current?"selected":""}>${s}</option>`
    ).join("");
}


// SEARCH
function filterData(){

    const key = document.getElementById("search").value.toLowerCase();

    const filtered = allData.filter(r =>
        (r["Code"]||"").toLowerCase().includes(key) ||
        (r["ID"]||"").toLowerCase().includes(key)
    );

    render(filtered);
}


// SAVE STATUS
async function save(code,i){

    const status = document.getElementById("status-"+i).value;

    await fetch(WEB_APP_URL,{
        method:"POST",
        body:JSON.stringify({
            action:"updateStatus",
            code:code,
            status:status
        })
    });

    alert("Status Updated");
}

loadData();

</script>

</body>
</html>
