<script>

const URL = "https://script.google.com/macros/s/AKfycbzKhUg5AEnNKu-PhnlKE74QfFckqVzzBl9jyKFZ3iN-QsTF7nU_kHo5DPQ3DiC-yvkCEA/exec";

let allData = [];

/* LOAD */
async function loadData(){

    try{

        const res = await fetch(URL + "?action=getData");

        const json = await res.json();

        // SAFETY CHECK (THIS FIXES MOST ERRORS)
        const data = Array.isArray(json) ? json : (json.data || []);

        allData = data;

        render(data);
        updateStats(data);

    }catch(err){
        console.log("FETCH ERROR:", err);
        document.getElementById("tableBody").innerHTML =
        `<tr><td colspan="6">❌ Failed to load data</td></tr>`;
    }
}

/* RENDER */
function render(data){

    if(!data.length){
        document.getElementById("tableBody").innerHTML =
        `<tr><td colspan="6">No data found</td></tr>`;
        return;
    }

    let html = "";

    data.forEach(r=>{

        let s = (r.Status || "").toLowerCase();

        html += `
        <tr>

            <td>${r["S/L"] || ""}</td>
            <td>${r["Code"] || ""}</td>
            <td>${r["ID"] || ""}</td>
            <td>${r["Borrow Date"] || ""}</td>

            <td>
                <span class="badge ${s}">
                    ${r.Status || ""}
                </span>
            </td>

            <td>
                <button onclick="save('${r["Code"]}',${r["_row"]})">Update</button>
            </td>

        </tr>`;
    });

    document.getElementById("tableBody").innerHTML = html;
}

/* SAVE */
async function save(code,row){

    try{

        await fetch(URL,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                action:"updateStatus",
                code,
                status:"Returned"
            })
        });

        showToast("Updated ✔");
        loadData();

    }catch(err){
        showToast("Update failed ❌");
    }
}

/* STATS */
function updateStats(data){

    let stats = {
        total:0,
        returned:0,
        due:0,
        damaged:0,
        lost:0
    };

    data.forEach(r=>{

        stats.total++;

        let s = (r.Status || "").toLowerCase().trim();

        if(s==="returned") stats.returned++;
        else if(s==="due") stats.due++;
        else if(s==="damaged") stats.damaged++;
        else if(s==="lost") stats.lost++;
    });

    document.getElementById("total").innerText = stats.total;
    document.getElementById("returned").innerText = stats.returned;
    document.getElementById("due").innerText = stats.due;
    document.getElementById("damaged").innerText = stats.damaged;
    document.getElementById("lost").innerText = stats.lost;
}

/* TOAST */
function showToast(msg){
    const t = document.getElementById("toast");
    t.innerText = msg;
    t.classList.add("show");
    setTimeout(()=>t.classList.remove("show"),2000);
}

/* AUTO REFRESH */
setInterval(loadData, 5000);

/* INIT */
loadData();

</script>
