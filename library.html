<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Library Status System</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

body{
    font-family:Poppins,sans-serif;
    background:#f5f7fb;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
}

h2{
    color:#1d4ed8;
}

.search-box{
    width:100%;
    padding:12px;
    margin:15px 0;
    border-radius:10px;
    border:1px solid #ccc;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    border-radius:10px;
    overflow:hidden;
}

th{
    background:#1e3a8a;
    color:white;
    padding:10px;
}

td{
    padding:10px;
    border-bottom:1px solid #eee;
}

select{
    width:100%;
    padding:6px;
}

button{
    background:#16a34a;
    color:white;
    border:none;
    padding:7px 12px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#15803d;
}

</style>

</head>

<body>

<div class="container">

<h2>📚 Borrowed Book Status</h2>

<input type="text" class="search-box" id="search" placeholder="Search by Code / ID / Date..." onkeyup="filterData()">

<table>

<thead>
<tr>
    <th>S/L</th>
    <th>Code</th>
    <th>ID</th>
    <th>Borrow Date</th>
    <th>Status</th>
    <th>Save</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

</table>

</div>

<script>

const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzKhUg5AEnNKu-PhnlKE74QfFckqVzzBl9jyKFZ3iN-QsTF7nU_kHo5DPQ3DiC-yvkCEA/exec";

let allData = [];

async function loadData(){

    const res = await fetch(WEB_APP_URL + "?action=getData");
    allData = await res.json();

    render(allData);
}

function render(data){

    let html = "";

    data.forEach((row,i)=>{

        html += `
        <tr>
            <td>${row["S/L"] || ""}</td>
            <td>${row["Code"] || ""}</td>
            <td>${row["ID"] || ""}</td>
            <td>${row["Borrow Date"] || ""}</td>

            <td>
                <select id="status-${i}">
                    ${getStatusOptions(row["Status"])}
                </select>
            </td>

            <td>
                <button onclick="save('${row["Code"]}',${i})">Save</button>
            </td>
        </tr>
        `;
    });

    document.getElementById("tableBody").innerHTML = html;
}


// STATUS DROPDOWN OPTIONS
function getStatusOptions(selected){

    const options = ["Borrowed","Submitted","Lost","Damaged"];

    return options.map(o =>
        `<option ${o===selected?"selected":""}>${o}</option>`
    ).join("");
}


// SEARCH FUNCTION
function filterData(){

    const key = document.getElementById("search").value.toLowerCase();

    const filtered = allData.filter(r =>
        (r["Code"]||"").toLowerCase().includes(key) ||
        (r["ID"]||"").toLowerCase().includes(key) ||
        (r["Borrow Date"]||"").toLowerCase().includes(key)
    );

    render(filtered);
}


// SAVE STATUS
async function save(code,i){

    const status = document.getElementById("status-"+i).value;

    await fetch(WEB_APP_URL,{
        method:"POST",
        body:JSON.stringify({
            action:"updateStatus",
            code:code,
            status:status
        })
    });

    alert("Status Updated");
}

loadData();

</script>

</body>
</html>
