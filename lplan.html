<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>নির্ঝর ক্যান্টনমেন্ট পাবলিক স্কুল ও কলেজ - পাঠ পরিকল্পনা</title>

<style>

body{
    font-family: Arial;
    background:#eef3fb;
    padding:10px;
}

/* 📦 CONTAINER */
.container{
    max-width:1100px;
    margin:20px auto;
    background:white;
    padding:15px;
    border-radius:12px;
    border:2px solid #1e3a8a;
    box-shadow:0 8px 20px rgba(0,0,0,0.1);
}

/* 🏫 TITLE */
h2{
    text-align:center;
    color:#1e3a8a;
    font-size:20px;
    line-height:1.5;
}

/* 📋 FORM */
.form-box{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
    margin-top:15px;
}

/* 📱 TABLE FIX FOR MOBILE */
table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
    display:block;
    overflow-x:auto;
    white-space:nowrap;
    border:2px solid #1e3a8a;
}

th, td{
    border:1px solid #cbd5e1;
    padding:8px;
    text-align:center;
    font-size:14px;
}

th{
    background:#1e3a8a;
    color:white;
}

/* INPUTS */
select, textarea{
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
    width:100%;
}

textarea{
    height:100px;
    resize:none;
}

/* BUTTONS */
button{
    padding:10px;
    border:none;
    border-radius:6px;
    background:#10b981;
    color:white;
    cursor:pointer;
    font-size:15px;
}

button:hover{
    background:#059669;
}

/* ACTION BUTTONS */
.edit-btn{ background:#f59e0b; }
.delete-btn{ background:red; }

/* 📱 RESPONSIVE */
@media(min-width:768px){

    .form-box{
        grid-template-columns:1fr 1fr;
    }

    h2{
        font-size:26px;
    }
}

@media(min-width:1024px){

    .form-box{
        grid-template-columns:1fr 1fr 1fr;
    }
}

</style>
</head>

<body>

<div class="container">

<h2>
নির্ঝর ক্যান্টনমেন্ট পাবলিক স্কুল ও কলেজ<br>
পাঠ পরিকল্পনা
</h2>

<div class="form-box">

<select id="subject">
<option>বিষয় নির্বাচন</option>
<option>বাংলা</option>
<option>ইংরেজি</option>
<option>গণিত</option>
<option>রসায়নবিজ্ঞান</option>
<option>পদার্থবিজ্ঞান</option>
<option>আইসিটি</option>
<option>উদ্ভিদবিদ্যা</option>
<option>প্রাণীবিদ্যা</option>
</select>

<select id="class">
<option>শ্রেণী নির্বাচন</option>
<option>একাদশ</option>
<option>দ্বাদশ</option>
</select>

<select id="section">
<option>শাখা নির্বাচন</option>
<option>ওমেগা</option>
<option>ডেলটা</option>
<option>পাই</option>
<option>সিগমা</option>
<option>ফোটন</option>
<option>প্রোটন</option>
<option>নিউট্রন</option>
<option>অরবিট</option>
</select>

<textarea id="topic" placeholder="পাঠ পরিকল্পনা লিখুন"></textarea>

</div>

<div style="text-align:center;margin-top:10px;">
<button onclick="saveLesson()">💾 Save</button>
</div>

<table>

<thead>
<tr>
<th>SL</th>
<th>বিষয়</th>
<th>শ্রেণী</th>
<th>শাখা</th>
<th>টপিক</th>
<th>Action</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

</table>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    doc,
    setDoc,
    updateDoc,
    deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "sjmnew-849d4.firebaseapp.com",
  projectId: "sjmnew-849d4",
  storageBucket: "sjmnew-849d4.appspot.com",
  messagingSenderId: "551669982044",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let editMode = false;
let editId = "";

// 💾 SAVE
window.saveLesson = async function(){

    const subject = document.getElementById("subject").value;
    const className = document.getElementById("class").value;
    const section = document.getElementById("section").value;
    const topic = document.getElementById("topic").value.trim();

    if(!subject || !className || !section || !topic){
        alert("সব তথ্য পূরণ করুন");
        return;
    }

    if(editMode){

        await updateDoc(doc(db,"lessoplan",editId),{
            subject,
            class: className,
            section,
            topic
        });

        editMode = false;
        editId = "";
        loadData();
        return;
    }

    const snapshot = await getDocs(collection(db,"lessoplan"));
    let maxSL = 0;

    snapshot.forEach(d=>{
        const data = d.data();
        if(data.sl > maxSL) maxSL = data.sl;
    });

    const newSL = maxSL + 1;
    const docId = "LP" + Date.now();

    await setDoc(doc(db,"lessoplan",docId),{
        sl:newSL,
        subject,
        class: className,
        section,
        topic
    });

    loadData();
    clearForm();
};

// 📥 LOAD
async function loadData(){

    const table = document.getElementById("tableBody");
    table.innerHTML = "";

    const snapshot = await getDocs(collection(db,"lessoplan"));

    snapshot.forEach(docSnap=>{

        const d = docSnap.data();

        table.innerHTML += `
        <tr>
            <td>${d.sl}</td>
            <td>${d.subject}</td>
            <td>${d.class}</td>
            <td>${d.section}</td>
            <td>${d.topic}</td>
            <td>
                <button class="edit-btn" onclick='editLesson("${docSnap.id}",${JSON.stringify(d)})'>Edit</button>
                <button class="delete-btn" onclick="deleteLesson('${docSnap.id}')">Delete</button>
            </td>
        </tr>`;
    });
}

window.loadData = loadData;

// ✏️ EDIT
window.editLesson = function(id,data){
    document.getElementById("subject").value = data.subject;
    document.getElementById("class").value = data.class;
    document.getElementById("section").value = data.section;
    document.getElementById("topic").value = data.topic;

    editMode = true;
    editId = id;
};

// 🗑 DELETE
window.deleteLesson = async function(id){
    if(!confirm("Delete?")) return;
    await deleteDoc(doc(db,"lessoplan",id));
    loadData();
};

// CLEAR
function clearForm(){
    document.getElementById("subject").value="";
    document.getElementById("class").value="";
    document.getElementById("section").value="";
    document.getElementById("topic").value="";
}

loadData();

</script>

</body>
</html>
