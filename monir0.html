<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MONIR'S DEN</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Poppins', sans-serif;
    }

    body{
        min-height:100vh;
        background: radial-gradient(circle at top,#1f4037,#0f2027);
        display:flex;
        flex-direction:column;
        align-items:center;
        color:white;
    }

    header{
        padding:25px 10px 10px;
        text-align:center;
    }

    header h1{
        font-size:34px;
        letter-spacing:3px;
        font-weight:700;
        background: linear-gradient(90deg,#00f5a0,#00d9f5);
        -webkit-background-clip:text;
        -webkit-text-fill-color:transparent;
    }

    header p{
        font-size:14px;
        opacity:0.7;
        margin-top:5px;
    }

    .container{
        width:100%;
        max-width:900px;
        padding:20px;
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
        gap:15px;
    }

    .btn{
        padding:18px 10px;
        border-radius:16px;
        border:none;
        cursor:pointer;
        font-weight:600;
        font-size:14px;
        color:white;
        background: rgba(255,255,255,0.08);
        backdrop-filter: blur(10px);
        border:1px solid rgba(255,255,255,0.1);
        transition:0.3s;
        box-shadow:0 8px 20px rgba(0,0,0,0.3);
        position:relative;
        overflow:hidden;
    }

    .btn:before{
        content:"";
        position:absolute;
        top:0;
        left:-100%;
        width:100%;
        height:100%;
        background:linear-gradient(120deg,transparent,rgba(255,255,255,0.2),transparent);
        transition:0.5s;
    }

    .btn:hover:before{
        left:100%;
    }

    .btn:hover{
        transform:translateY(-5px) scale(1.03);
        background:rgba(0,255,200,0.15);
        border:1px solid rgba(0,255,200,0.4);
    }

    .highlight{
        border:1px solid #00f5a0;
        box-shadow:0 0 15px #00f5a0;
    }

    @media(max-width:500px){
        header h1{font-size:26px;}
        .btn{font-size:13px;padding:16px;}
    }
</style>
</head>

<body>

<header>
    <h1>MONIR'S DEN</h1>
    <p>Smart Academic Dashboard</p>
</header>

<div class="container">

    <button class="btn highlight" onclick="goSite('https://docs.google.com/spreadsheets/d/1eKh71l0FOYzuvjRMoLL53F6xHawD6ETYrFxyDt8deiM/edit?usp=sharing')">
        Seat Plan
    </button>

    <button class="btn highlight" onclick="goSite('https://docs.google.com/spreadsheets/d/12LCv9wWFvoB0mmCl8pZX8m2btHklOdTZjkrILamNMTQ/edit?usp=sharing')">
        Exam Flow 1st Year
    </button>

    <button class="btn highlight" onclick="goSite('https://docs.google.com/spreadsheets/d/1Om73FfPCt4oQV6AHFIdiVfRL3_IMp3NaTiD4BVvU-cA/edit?usp=sharing')">
        CT Analysis
    </button>

    <button class="btn" onclick="goSite('https://www.ncpsc.edu.bd')">Button 4</button>
    <button class="btn" onclick="goSite('https://www.ncpsc.edu.bd')">Button 5</button>
    <button class="btn" onclick="goSite('https://www.ncpsc.edu.bd')">Button 6</button>
    <button class="btn" onclick="goSite('https://www.ncpsc.edu.bd')">Button 7</button>
    <button class="btn" onclick="goSite('https://www.ncpsc.edu.bd')">Button 8</button>
    <button class="btn" onclick="goSite('https://www.ncpsc.edu.bd')">Button 9</button>
    <button class="btn" onclick="goSite('https://www.ncpsc.edu.bd')">Button 10</button>

</div>

<script>
function goSite(url){
    window.open(url, "_blank");
}
</script>

</body>
</html>
