<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Teacher’s Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
}

/* HEADER */
header{
    text-align:center;
    padding:25px 15px;
    color:white;
}

header h1{
    font-size:18px;
    font-weight:600;
}

header p{
    font-size:12px;
    opacity:0.8;
}

/* CARD */
.card{
    max-width:600px;
    margin:10px auto 30px;
    padding:20px;
    background:rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);
    border-radius:20px;
    box-shadow:0 8px 30px rgba(0,0,0,0.2);
    border:1px solid rgba(255,255,255,0.2);
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

/* BUTTON */
.btn{
    position:relative;
    padding:18px 10px;
    border:none;
    border-radius:16px;
    cursor:pointer;
    font-weight:500;
    font-size:13px;
    color:white;
    background:linear-gradient(135deg,rgba(255,255,255,0.15),rgba(255,255,255,0.05));
    backdrop-filter: blur(8px);
    border:1px solid rgba(255,255,255,0.2);
    transition:0.3s;
    overflow:hidden;
    min-height:75px;
}

.btn:hover{
    transform:translateY(-4px) scale(1.03);
    background:linear-gradient(135deg,#22c55e,#3b82f6);
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

.icon{
    display:block;
    font-size:18px;
    margin-bottom:6px;
}

@media(max-width:480px){
    .grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>নির্ঝর ক্যান্টনমেন্ট পাবলিক স্কুল ও কলেজ</h1>
    <p>Teacher’s  Dashboard</p>
</header>

<div class="card">

    <div class="grid">

        <button class="btn"><span class="icon">🏖️</span>Holiday Task</button>
        <button class="btn"><span class="icon">📘</span>Lesson Plan</button>
        <button class="btn"><span class="icon">📅</span>Attendance</button>
        <button class="btn"><span class="icon">📝</span>Exam Routine</button>
        <button class="btn"><span class="icon">📈</span>Marks Entry</button>
        <button class="btn"><span class="icon">👨‍🎓</span>Student List</button>
        <button class="btn"><span class="icon">📚</span>Homework</button>
        <button class="btn"><span class="icon">📢</span>Notice Board</button>
        <button class="btn"><span class="icon">📊</span>Reports</button>
        <button class="btn"><span class="icon">⚙️</span>Settings</button>

    </div>

</div>

</body>
</html>
