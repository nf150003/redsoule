<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Teacher’s Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
    padding:12px;
}

/* HEADER */

header{
    text-align:center;
    padding:20px 8px;
    color:white;
}

header h1{
    font-size:18px;
    font-weight:600;
    line-height:1.5;
}

header p{
    font-size:11px;
    opacity:0.85;
    margin-top:4px;
}

/* MAIN CARD */

.card{
    max-width:700px;
    margin:auto;
    padding:15px;
    background:rgba(255,255,255,0.10);
    backdrop-filter:blur(12px);
    border-radius:24px;
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:0 10px 35px rgba(0,0,0,0.25);
}

/* GRID */

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

/* BUTTON */

.btn{
    position:relative;
    border:none;
    border-radius:16px;
    padding:16px 8px;
    min-height:85px;
    cursor:pointer;
    overflow:hidden;

    color:white;
    font-size:11px;
    font-weight:500;
    text-align:center;

    background:
    linear-gradient(
    135deg,
    rgba(255,255,255,0.18),
    rgba(255,255,255,0.05));

    border:1px solid rgba(255,255,255,0.18);

    backdrop-filter:blur(10px);

    transition:0.35s;
}

/* SHINE EFFECT */

.btn::before{
    content:'';
    position:absolute;
    top:0;
    left:-120%;
    width:100%;
    height:100%;

    background:
    linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,0.35),
    transparent);

    transition:0.6s;
}

.btn:hover::before{
    left:120%;
}

/* HOVER */

.btn:hover{
    transform:translateY(-4px) scale(1.03);

    background:
    linear-gradient(
    135deg,
    #06b6d4,
    #3b82f6);

    box-shadow:
    0 12px 28px rgba(0,0,0,0.30);
}

/* CLICK */

.btn:active{
    transform:scale(0.96);
}

/* ICON */

.icon{
    display:block;
    font-size:22px;
    margin-bottom:6px;
}

/* FOOTER */

.footer{
    text-align:center;
    color:white;
    margin-top:18px;
    font-size:10px;
    opacity:0.7;
}

</style>
</head>

<body>

<header>
    <h1>নির্ঝর ক্যান্টনমেন্ট পাবলিক স্কুল ও কলেজ</h1>
    <p>Teacher’s Premium Dashboard</p>
</header>

<div class="card">

    <div class="grid">

        <!-- HOLIDAY TASK BUTTON -->
        <button class="btn"
        onclick="window.location.href='lessonplan.html'">

            <span class="icon">🏖️</span>
            Holiday Task

        <button class="btn"
        onclick="window.location.href='examflow.html'">

            <span class="icon">🔄</span>
            Exam Flow

        </button>

        <button class="btn">
            <span class="icon">📅</span>
            Attendance
        </button>

        <button class="btn">
            <span class="icon">📝</span>
            Exam Routine
        </button>

        <button class="btn">
            <span class="icon">📈</span>
            Marks Entry
        </button>

        <button class="btn">
            <span class="icon">👨‍🎓</span>
            Student List
        </button>

        <button class="btn">
            <span class="icon">📚</span>
            Homework
        </button>

        <button class="btn">
            <span class="icon">📢</span>
            Notice Board
        </button>

        <button class="btn">
            <span class="icon">📊</span>
            Reports
        </button>

        <button class="btn">
            <span class="icon">⚙️</span>
            Settings
        </button>

    </div>

</div>

<div class="footer">
    © Teacher’s Panel System
</div>

</body>
</html>
